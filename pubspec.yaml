name: mobile
description: "Kraken Draw Flutter Mobile App - Client Dashboard"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0

  # Networking
  dio: ^5.4.0
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.3

  # State Management
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7

  # Storage
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.2.2

  # Routing
  go_router: ^18.1.1

  # Utils
  intl: ^0.20.3
  image_picker: ^1.1.2
  image_cropper: ^13.0.0
  image: ^4.2.0
  path_provider: ^2.1.4

  # WebView del diagrama + apertura de archivos descargados
  webview_flutter: ^4.10.0
  open_filex: ^4.5.0

  # UI: Skeleton loaders, animations
  shimmer: ^4.0.0
  flutter_animate: ^4.3.0
  google_fonts: ^9.0.0
  vector_math: ^2.1.4
  flutter_svg: ^2.3.0

  # Code Generation
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  fl_chart: ^1.3.0
  flutter_edge_ai: ^2.6.0
  flutter_edge_ai_mediapipe: ^1.3.0
  sqflite: ^2.4.5
  sqflite_common_ffi: ^2.4.5
  path: ^1.9.1
  crypto: ^3.0.8
  speech_to_text: ^7.5.0
  pdf: ^3.13.1
  archive: ^4.5.2
  share_plus: ^13.3.1
  flutter_file_dialog: ^3.3.6
  file_selector: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.7
  riverpod_generator: ^4.0.9
  freezed: ^4.0.3
  json_serializable: ^6.9.5

flutter:
  uses-material-design: true
  assets:
    - assets/knowledge/
    - assets/fonts/
    - assets/kraken_logo_trans.png
